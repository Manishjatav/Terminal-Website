<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacker Terminal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=shield_lock" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar hidden" id="navbar-section" >
      <div class="logo">🛡️ CyberSecurity </div>

      <div class="links">
        <a href="#">Home</a>
        <div class="icon-scan-eye"></div>
        <a href="#">Events</a>
        <a href="#">Workshops</a>
        <a href="#">About</a>
        <a href="">Contact</a>
      </div>
      
      <div class="menu-icon">
        <i class="fa-solid fa-bars"></i>
      </div>

      <a href="#" class="login">
        <span class="dot"></span> LOGIN
      </a>

    </nav>

    <!-- BOOT SCREEN -->
    <div id="boot">
      <span id="typed"></span>
    </div>

    <!-- TERMINAL SECTION -->
    <div id="terminal" class="hidden">

      <!-- TOP BAR -->
      <div class="topbar">
        <div class="title">
          <span class="material-symbols-outlined">shield_lock</span>
          root@cryx — server
        </div>
        
        <div class="buttons">
          <span class="btn red"></span>
          <span class="btn yellow"></span>
          <span class="btn green"></span>
        </div>
      </div>

      <!-- BODY -->
      <div class="body">
        <div class="terminalText">
          <span>Initializing the connection ... [ OK ]
          </span>
          <br>
          <span>Loading member database... [ 34 MEMBERS ]
          </span>
        </div>
        <div id="output"></div>
        
        <div class="input-line">
          <span class="prompt">guest@cryx:~$</span>
          <input id="commandInput" type="text" autocomplete="off" autofocus />
        </div>
      </div>

      <!-- BOTTOM BAR -->
      <div class="topbar">
        <div class="title">root@cryx — server</div>
      </div>

    </div>
    

<script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
<script src="script.js"></script>

</body>
</html>
